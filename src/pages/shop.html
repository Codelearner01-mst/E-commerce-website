<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce website</title>
    <link rel="stylesheet" href="../styles/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      header {
        background-color: var(--color-brand);
      }

      body {
        background: var(--color-page);
        color: var(--color-ink);
      }

      .shop-toolbar {
        background-color: rgba(190, 170, 150, 0.97);
        color: #f8f8f8;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06);
        position: sticky;
        top: calc(var(--layout-header-height) + var(--layout-search-height));
        z-index: 54;
      }
      .toolbar-inner {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
      }
      .toolbar-select {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        padding: 8px 10px;
        border-radius: 6px;
        background-color: var(--color-brand);
      }
      .toolbar-select option {
        background: #2b2d2f;
        color: #fff;
        background: var(--color-page);
      }
      .filter-dropdown-container {
        position: relative;
        display: inline-block;
      }
      .filter-btn {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        background-color: var(--color-brand-tint);
        border-radius: 6px;
        border-bottom: 1px solid var(--color-border);
        transition: all 0.2s ease;
      }
      .filter-btn:hover {
        background: rgba(255, 255, 255, 0.07);
        border-bottom: 1px solid var(--color-border);
        .filter-btn[aria-expanded="true"] .main-arrow {
          transform: rotate(180deg);
        }
        border-color: rgba(184, 154, 106, 0.3);
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        background: #2a2d34;
        color: #fff;
        min-width: 240px;
        border-radius: 8px;
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.35);
        z-index: 120;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .filter-menu.open {
        display: block;
      }
      .filter-menu ul {
        list-style: none;
        margin: 0;
        color: rgba(247, 243, 238, 0.96);
      }
      .filter-menu li {
        border-radius: 4px;
      }
      .group-toggle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 4px;
      }
      .group-toggle:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .filter-group .submenu {
        display: none;
        list-style: none;
        padding-left: 12px;
        margin-top: 4px;
      }
      .submenu li {
        padding: 6px 10px;
        font-size: 0.9rem;
        color: #d9d3cc;
        cursor: pointer;
      }
      .submenu li:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
      }
      .filter-group.expanded .submenu {
        display: block;
      }
      .arrow {
        transition: transform 180ms ease;
        font-size: 0.8rem;
        color: #bcb5af;
      }
      .filter-group.expanded .arrow {
        transform: rotate(90deg);
        color: #fff;
      }
      .submenu {
        padding-left: 8px;
        margin-top: 6px;
      }
      .search-sticky {
        position: sticky;
        top: var(--layout-header-height);
        z-index: 55;
        width: 100%;
        background-color: var(--color-brand-tint);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--color-border);
        box-shadow: 0 8px 24px rgba(24, 20, 16, 0.04);
      }
      .search-sticky .search-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 10px 16px 12px;
      }
      .search-sticky input {
        box-shadow: 0 8px 18px rgba(20, 17, 14, 0.06);
      }
      .cat-rail {
        background: rgba(255, 255, 255, 0.72);
        border-bottom: 1px solid var(--color-border);
      }
      .cat-rail-inner {
        max-width: 1100px;
        margin: 0 auto;
        padding: 12px 16px 0;
      }
      .cat-btn {
        border: 1px solid rgba(31, 29, 26, 0.08);
        background: #fff;
        color: var(--color-ink);
        padding: 8px 14px;
        border-radius: 999px;
        transition: all 0.2s ease;
        font-size: 0.9rem;
      }
      .cat-btn.active {
        background: var(--color-brand-pale);
        border-color: rgba(184, 154, 106, 0.3);
        color: #4d3c1c;
      }
      .cat-btn:hover {
        border-color: rgba(31, 29, 26, 0.15);
        box-shadow: 0 4px 14px rgba(31, 29, 26, 0.04);
      }
      @media (max-width: 640px) {
        .toolbar-inner {
          flex-direction: column;
          align-items: flex-start;
        }
        .search-sticky .search-wrap {
          padding-left: 12px;
          padding-right: 12px;
        }
      }

      .shop-text {
        color: rgba(247, 243, 238, 0.96);
      }
    </style>
  </head>

  <body>
    <header
      id="header-bar"
      class="fixed top-0 left-0 right-0 border-gray-100 flex justify-between items-center px-4 md:px-8 py-4 z-50 transition-all duration-300"
    >
      <h1
        class="text-white text-2xl md:text-3xl font-serif tracking-widest uppercase"
      >
        Vision Jewelry
      </h1>
    </header>
    <main class="pt-2 pb-20">
      <section
        class="py-2"
        id="home"
        style="
          background-image: url(&quot;../images/segal-jewelry-NsH-CvU0deg-unsplash.jpg&quot;);
          background-size: cover;
        "
      >
        <div class="hero-overlay"></div>
        <div class="mt-5 mb-8 px-4">
          <div class="rounded-lg p-8 text-center max-w-2xl mx-auto">
            <h2
              class="text-5xl md:text-4xl font-serif font-bold text-gray-900 tracking-wide"
            >
              Shop Collection
            </h2>
            <p class="shop-text mt-2">
              Explore our complete range of exquisite, handcrafted jewelry.
            </p>
          </div>
        </div>
      </section>

      <div class="search-sticky">
        <div class="search-wrap">
          <input
            type="text"
            placeholder="Search for products..."
            id="search-input"
            class="px-4 py-3 w-full md:w-2/3 bg-white text-lg border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500"
          />
        </div>
      </div>

      <section class="shop-toolbar px-4 py-4">
        <div class="toolbar-inner">
          <div class="flex items-center gap-2">
            <div class="text-white font-medium">Sort by</div>
            <select
              id="sort-by"
              class="toolbar-select bg-gray-800 text-white border border-gray-700 px-3 py-2 rounded-md focus:outline-none"
              aria-label="Sort products"
            >
              <option value="relevance">Relevance</option>
              <option value="newest">Newest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
          </div>

          <div class="filter-dropdown-container">
            <button
              id="filter-btn"
              class="filter-btn flex items-center gap-2"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <i class="fa-solid fa-filter"></i>
              <span>Filter by</span>
              <i
                class="fa-solid fa-angle-down main-arrow transition-transform duration-200"
              ></i>
            </button>

            <div id="filter-menu" class="filter-menu" role="menu">
              <ul>
                <li data-filter-group="price" class="filter-group">
                  <div class="group-toggle" role="button" tabindex="0">
                    <strong>Price</strong>
                    <i class="fa-solid fa-angle-right arrow"></i>
                  </div>
                  <ul class="submenu" aria-label="Price ranges">
                    <li class="price-range" data-min="0" data-max="30">
                      0 - 30
                    </li>
                    <li class="price-range" data-min="30" data-max="50">
                      30 - 50
                    </li>
                    <li class="price-range" data-min="50" data-max="100">
                      50 - 100
                    </li>
                    <li class="price-range" data-min="100" data-max="">100+</li>
                  </ul>
                </li>

                <li data-filter-group="category" class="filter-group mt-3">
                  <div class="group-toggle" role="button" tabindex="0">
                    <strong>Category</strong>
                    <i class="fa-solid fa-angle-right arrow"></i>
                  </div>
                  <ul class="submenu" aria-label="Categories">
                    <li class="category-item" data-category="all">All</li>
                    <li class="category-item" data-category="rings">Rings</li>
                    <li class="category-item" data-category="necklaces">
                      Necklaces
                    </li>
                    <li class="category-item" data-category="earrings">
                      Earrings
                    </li>
                    <li class="category-item" data-category="bracelets">
                      Bracelets
                    </li>
                  </ul>
                </li>

                <li class="mt-3 border-t border-gray-700 pt-2">
                  <button
                    id="clear-filters"
                    class="w-full text-center text-xs text-amber-500 hover:underline"
                  >
                    Clear Filters
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </section>

      <section class="cat-rail">
        <div class="cat-rail-inner flex flex-wrap gap-2 pb-3">
          <button class="cat-btn active" data-category="all">All</button>
          <button class="cat-btn" data-category="rings">Rings</button>
          <button class="cat-btn" data-category="necklaces">Necklaces</button>
          <button class="cat-btn" data-category="earrings">Earrings</button>
          <button class="cat-btn" data-category="bracelets">Bracelets</button>
        </div>
      </section>

      <section id="products" class="px-4 mt-5 py-12 bg-gray-50">
        <div class="max-w-7xl mx-auto">
          <div
            id="product-list"
            class="product-list grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-8 mb-6 px-4 md:px-0"
          ></div>
        </div>
      </section>
    </main>
    <footer id="footer" class="bg-gray-900 text-gray-400 py-14 px-5"></footer>
  </body>
  <script type="module" src="shop.js" defer></script>
</html>

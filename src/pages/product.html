<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce website</title>
    <link rel="stylesheet" href="../styles/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      :root {
        --header-offset: 64px;
        --search-bar-h: 54px;

        /*COLORS*/
        --ink: #1f1d1a;
        --muted: #6d675f;
        --color-primary: #bb9558; /*Primary color*/
        --color-secondary: #efe3cc; /*Secondary color*/
        --muted-beidge-gold: rgba(190, 170, 150, 0.97);
        --text-color: rgba(247, 243, 238, 0.96);
        --background: #f8f8f8;
        --background-soft: #fcf9f9;
        --panel: #201f1d;
        --panel-soft: #2b2a28;
        --line: rgba(31, 29, 26, 0.08);
        --color-border: #6d675f;

        /*FONT SIZES*/
        --font-size-section-heading: 36px;
        --font-size-heading-base: 56px;
        --font-size-heading-small: 64px;
        --font-size-heading-medium: 69px;
        --font-size-heading-large: 155px;
        --font-size-small: 12px;
        --font-size-small-up: 14px;
        --font-size-base: 1rem;
        --font-size-medium: 18px;
        --font-size-large: 20px;

        /*BORDERS*/
        --border-radius-sm: 6px;
        --border-radius-base: 16px;
        --border-radius-md-up: 18px;
        --border-radius-full: 999px;

        /*SPACING*/
        --letter-spacing: 0.5em;
      }

      header {
        background-color: var(--color-primary);
      }

      .product-intro {
        background-color: var(--background);
      }
    </style>
  </head>

  <body>
    <header
      id="header-bar"
      class="fixed top-0 left-0 right-0 bg-white/90 border-b border-gray-100 flex justify-between items-center px-4 md:px-8 py-4 z-50 transition-all duration-300"
    >
      <h1
        class="text-black text-2xl md:text-3xl font-serif tracking-widest uppercase"
      >
        Vision jewelry
      </h1>
    </header>
    <main class="mt-16">
      <div class="px-4 py-5 product-intro">
        <h2 class="text-4xl md:text-4xl font-serif font-bold text-gray-900">
          Product Details
        </h2>
        <p class="text-gray-500 text-sm mt-2">
          View product information and add to cart
        </p>
      </div>
      <section class="mt-10 py-3 bg-gray-300">
        <div id="product-container" class="product-container px-2 mb-15"></div>
        <div
          id="products-similar-container"
          class="products-similar-container"
        ></div>
      </section>
    </main>

    <footer id="footer" class="bg-gray-900 text-gray-400 py-14 px-5"></footer>
  </body>
  <script type="module" src="./product.js" defer></script>
</html>

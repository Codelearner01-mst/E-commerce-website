<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Shopping Cart | Vision Jewelry</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/output.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      header {
        background-color: var(--color-brand-tint);
      }

      .cart-intro {
        background-color: var(--color-page);
      }

      .carts {
        background-color: var(--color-brand-tint);
      }
      .result-container {
        background-color: var(--color-brand-tint);
      }
    </style>
  </head>

  <body class="cart-page">
    {% from "macros.html" import breadcrumb, site_footer %}
    <header
      id="header-bar"
      class="fixed top-0 left-0 right-0 shadow-gray-200 border-gray-100 flex justify-between items-center px-4 md:px-8 py-6 z-50 transition-all duration-300"
    >
      <h1
        class="text-black text-2xl md:text-3xl font-serif tracking-widest uppercase"
      >
        Vision Jewelry
      </h1>
    </header>
    <main class="mt-20">
      {{ breadcrumb("Shopping Cart") }}
      <div class="page-heading cart-intro mb-4">
        <h2 class="text-4xl md:text-4xl font-serif font-bold text-gray-900">
          Shopping Cart
        </h2>
        <p class="text-gray-500 mt-2">Review and manage your items</p>
      </div>
      <div class="cart-layout">
        <section class="cart-items-section">
          <div class="carts">
            <div id="carts-list" class="flex gap-8 flex-col mt-13 mb-15">
              <p
                id="empty-cart-message"
                class="text-center text-gray-500 hidden"
              >
                Your cart is empty.
              </p>
            </div>
          </div>
        </section>
        <section class="cart-summary-section">
          <div
            id="result-container"
            class="result-container mx-auto hidden lg:mx-0 w-full rounded-md shadow-sm"
          >
            <div class="flex flex-col gap-5 p-6 w-full">
              <h3 class="cart-summary-title">Order summary</h3>
              <div class="flex items-center justify-between">
                <p class="text-[18px]">Subtotal</p>
                <p id="subtotal-amount" class="text-[18px] font-medium">
                  $0.00
                </p>
              </div>
              <div class="flex items-center justify-between">
                <p class="text-[18px]">Delivery fee</p>
                <p id="delivery-fee" class="text-[18px] font-medium">Free</p>
              </div>
              <div class="flex items-center justify-between">
                <p class="text-[18px]">Total</p>
                <p id="total-amount" class="text-[18px] font-medium">$0.00</p>
              </div>
              <button
                id="checkout-btn"
                class="w-full bg-black font-sans text-white px-4 py-3 mt-3.5 mb-1.5 hover:bg-gray-800 transition rounded-sm"
              >
                PROCEED TO CHECKOUT
              </button>
            </div>
          </div>

          <a href="{{ url_for('pages.shop') }}" class="continue-shopping">Continue shopping <span aria-hidden="true">&rarr;</span></a>
        </section>
      </div>
    </main>
    {{ site_footer() }}
  </body>
  <script
    type="module"
    src="{{url_for('static', filename='pages copy/carts.js')}}"
    defer
  ></script>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | Vision Jewelry</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/output.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      .product-intro {
        background-color: var(--color-page);
      }
    </style>
  </head>

  <body class="product-page">
    {% from "macros.html" import site_footer %}
    <header
      id="header-bar"
      class="fixed top-0 left-0 right-0 bg-white/90 border-b border-gray-100 flex justify-between items-center px-4 md:px-8 py-4 z-50 transition-all duration-300"
    >
      <h1
        class="site-wordmark text-2xl md:text-3xl font-serif tracking-widest uppercase"
      >
        Vision jewelry
      </h1>
    </header>
    <main class="mt-16 pb-16">
      <div class="page-heading product-intro">
        <h2
          id="product-page-title"
          class="text-4xl md:text-4xl font-serif font-bold text-gray-900"
        >
          Product Details
        </h2>
        <p class="text-gray-500 text-sm mt-2">
          View product information and add to cart
        </p>
      </div>
      <section
        class="mt-10 py-3"
        style="background-color: var(--color-page)"
        data-product-id="{{ product_id }}"
      >
        <div id="product-container" class="product-container px-2 mb-15"></div>
      </section>
      <section class="mb-8">
        <div
          id="products-similar-container"
          class="products-similar-container"
        ></div>
      </section>
    </main>

    {{ site_footer() }}
  </body>
  <script
    type="module"
    src="{{url_for('static', filename='pages copy/product.js')}}"
    defer
  ></script>
</html>
